<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle glow blob -->
  <ellipse cx="200" cy="520" rx="340" ry="240" fill="url(#glow)"/>
  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
  <!-- Logo mark -->
  <rect x="80" y="210" width="130" height="130" rx="32" fill="url(#mark)"/>
  <rect x="100" y="308" width="25" height="32" rx="5" fill="white" opacity="0.5"/>
  <rect x="135" y="291" width="25" height="49" rx="5" fill="white" opacity="0.75"/>
  <rect x="170" y="270" width="25" height="70" rx="5" fill="white"/>
  <!-- Title -->
  <text x="242" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">Personal Finance</text>
  <!-- Subtitle -->
  <text x="246" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="28" fill="#94a3b8" letter-spacing="0">Budgets · Net worth · Debt payoff · Savings</text>
  <!-- Indigo accent bar on left edge -->
  <rect x="0" y="0" width="6" height="630" fill="url(#mark)"/>
</svg>
